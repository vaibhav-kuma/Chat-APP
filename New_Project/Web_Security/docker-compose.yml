version: '3'

services:
  # DVWA - Damn Vulnerable Web Application
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    ports:
      - "8080:80"
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    networks:
      - security_labs

  # OWASP Juice Shop
  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - security_labs

  # WebGoat
  webgoat:
    image: webgoat/webgoat
    container_name: webgoat
    ports:
      - "8081:8080"
    networks:
      - security_labs

  # Simple Vulnerable PHP Application
  vuln-php:
    build:
      context: ./vuln-php-app
    container_name: vuln-php
    ports:
      - "8082:80"
    volumes:
      - ./vuln-php-app:/var/www/html
    networks:
      - security_labs

networks:
  security_labs:
    driver: bridge